name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-material-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-material-manager/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify application
        run: npm run verify

      - name: Build production container
        run: docker build -t ai-material-manager:ci .

      - name: Check production runtime dependencies
        run: docker run --rm ai-material-manager:ci node -e "require('./dist/server/app.module.js')"
