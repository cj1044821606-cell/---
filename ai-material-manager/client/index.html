<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3.0.1">
  <meta name="theme-color" content="#ffffff">
  <title>AI 物料版本管理</title>
  <style>
    /* 首屏外壳：JS 还在下载时先给出与应用一致的底色和品牌标识，避免白屏 */
    html, body { margin: 0; background: hsl(220 18% 97%); }
    .boot-shell { min-height: 100vh; display: grid; place-items: center; }
    .boot-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, hsl(215 60% 42%), hsl(215 65% 36%));
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.12);
      animation: boot-fade 180ms ease-out both;
    }
    @keyframes boot-fade { from { opacity: 0; transform: scale(0.96); } }
  </style>
</head>

<body>
  <div id="root"><div class="boot-shell" aria-label="正在加载"><div class="boot-mark"></div></div></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
